name: Accounts Service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'services/accounts-service/**'
      - 'common/**'
      - '.github/workflows/accounts-service-deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'services/accounts-service/**'
      - 'common/**'
  workflow_dispatch:

env:
  SERVICE_NAME: accounts-service
  REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
  IMAGE_NAME: accounts-service
  CONTAINER_NAME: accounts-service-container

jobs:
  build-and-deploy:
    name: Build and Deploy to Yandex Cloud
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Yandex Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_SERVICE_ACCOUNT_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/accounts-service/Dockerfile
          push: true
          tags: |
            cr.yandex/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:latest
            cr.yandex/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Deploy to Serverless Container
        run: |
          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY }}' > key.json
          yc config profile create deploy-profile
          yc config set service-account-key key.json
          rm key.json
          
          # Create container if not exists
          if ! yc serverless container get ${{ env.CONTAINER_NAME }} 2>/dev/null; then
            echo "Creating new serverless container..."
            yc serverless container create --name ${{ env.CONTAINER_NAME }}
          fi
          
          # Deploy new revision
          yc serverless container revision deploy \
            --container-name ${{ env.CONTAINER_NAME }} \
            --image cr.yandex/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --cores 1 \
            --memory 512MB \
            --execution-timeout 30s \
            --service-account-id ${{ secrets.YC_SERVICE_ACCOUNT_ID }} \
            --environment SERVICE_NAME=accounts-service \
            --environment SERVICE_ROLE=accounts \
            --environment SERVICE_PORT=8000
          
          echo "✅ Deployment complete!"
          
          # Get and display URL
          CONTAINER_URL=$(yc serverless container get ${{ env.CONTAINER_NAME }} --format json | jq -r '.url')
          echo "Container URL: $CONTAINER_URL"

  notify:
    name: Notify build status
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: always()
    
    steps:
      - name: Build succeeded
        if: needs.build-and-deploy.result == 'success'
        run: |
          echo "✅ Accounts service Docker image built and pushed successfully"
          
      - name: Build failed
        if: needs.build-and-deploy.result != 'success'
        run: |
          echo "❌ Accounts service build failed"
          exit 1
