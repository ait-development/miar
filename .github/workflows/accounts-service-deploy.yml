name: Accounts Service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'services/accounts-service/**'
      - 'common/**'
      - '.github/workflows/accounts-service-deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'services/accounts-service/**'
      - 'common/**'
  workflow_dispatch:

env:
  SERVICE_NAME: accounts-service
  REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
  IMAGE_NAME: accounts-service
  CONTAINER_NAME: accounts-service-container

jobs:
  build-and-deploy:
    name: Build and Deploy to Yandex Cloud
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Yandex Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_SERVICE_ACCOUNT_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/accounts-service/Dockerfile
          push: true
          tags: |
            cr.yandex/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:latest
            cr.yandex/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment complete
        run: |
          echo "✅ Docker image built and pushed successfully!"
          echo "Image: cr.yandex/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Latest: cr.yandex/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:latest"

  notify:
    name: Notify build status
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: always()
    
    steps:
      - name: Build succeeded
        if: needs.build-and-deploy.result == 'success'
        run: |
          echo "✅ Accounts service Docker image built and pushed successfully"
          
      - name: Build failed
        if: needs.build-and-deploy.result != 'success'
        run: |
          echo "❌ Accounts service build failed"
          exit 1
