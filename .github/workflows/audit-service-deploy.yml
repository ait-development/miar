name: Audit Service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'services/audit-service/**'
      - 'common/**'
      - '.github/workflows/audit-service-deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'services/audit-service/**'
      - 'common/**'
  workflow_dispatch:

env:
  SERVICE_NAME: audit-service
  REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
  IMAGE_NAME: audit-service
  CONTAINER_NAME: audit-service-container

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install -r services/audit-service/requirements.txt

      - name: Run component tests for audit-service
        run: |
          pytest tests/component/test_audit_service.py -v

  build-and-deploy:
    name: Build and Deploy to Yandex Cloud
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Yandex Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_SERVICE_ACCOUNT_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/audit-service/Dockerfile
          push: true
          tags: |
            cr.yandex/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:latest
            cr.yandex/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Configure Yandex Cloud CLI
        run: |
          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY }}' > key.json
          yc config profile create sa-profile
          yc config set service-account-key key.json
          yc config set cloud-id ${{ secrets.YC_CLOUD_ID }}
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          rm key.json

      - name: Deploy to Serverless Containers
        run: |
          # Get or create the container
          CONTAINER_ID=$(yc serverless container list --format json | jq -r ".[] | select(.name==\"${{ env.CONTAINER_NAME }}\") | .id")
          
          if [ -z "$CONTAINER_ID" ]; then
            echo "Creating new serverless container..."
            yc serverless container create \
              --name ${{ env.CONTAINER_NAME }} \
              --description "Audit Service - Serverless Container"
          else
            echo "Container already exists with ID: $CONTAINER_ID"
          fi
          
          # Deploy new revision
          echo "Deploying new revision..."
          yc serverless container revision deploy \
            --container-name ${{ env.CONTAINER_NAME }} \
            --image cr.yandex/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --cores 1 \
            --memory 512MB \
            --execution-timeout 30s \
            --service-account-id ${{ secrets.YC_SERVICE_ACCOUNT_ID }} \
            --environment SERVICE_NAME=audit-service \
            --environment SERVICE_ROLE=audit \
            --environment SERVICE_PORT=8000 \
            --environment SLEEP_SYMBOL=- \
            --environment RABBITMQ_URL=${{ secrets.RABBITMQ_URL }}

      - name: Get container URL
        run: |
          CONTAINER_URL=$(yc serverless container get ${{ env.CONTAINER_NAME }} --format json | jq -r '.url')
          echo "Container deployed successfully!"
          echo "Container URL: $CONTAINER_URL"
          echo "CONTAINER_URL=$CONTAINER_URL" >> $GITHUB_ENV

      - name: Health check
        run: |
          sleep 10
          curl -f ${{ env.CONTAINER_URL }}/health || echo "Health check failed, but deployment completed"

  notify:
    name: Notify deployment status
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: always()
    
    steps:
      - name: Deployment succeeded
        if: needs.build-and-deploy.result == 'success'
        run: |
          echo "✅ Audit service deployed successfully to Yandex Cloud Serverless Containers"
          
      - name: Deployment failed
        if: needs.build-and-deploy.result != 'success'
        run: |
          echo "❌ Audit service deployment failed"
          exit 1

