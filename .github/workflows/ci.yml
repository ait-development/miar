name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3.12-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_port_connectivity && rabbitmq-diagnostics -q check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run tests
        env:
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q

  build-images:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - customers-service
          - accounts-service
          - payments-service
          - cards-service
          - loans-service
          - notifications-service
          - audit-service
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/miar-${{ matrix.service }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -f docker/service.Dockerfile \
            --build-arg SERVICE_DIR=services/${{ matrix.service }} \
            -t $IMAGE_NAME:${{ github.sha }} \
            .

      - name: Push image (sha tag)
        if: github.event_name != 'pull_request'
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}

      - name: Push image (latest tag)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:latest
          docker push $IMAGE_NAME:latest

  deploy-placeholder:
    needs: build-images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deployment placeholder
        run: |
          echo "Add deployment commands here (e.g., kubectl apply or ssh docker compose pull)."

